name: One-time mobile secret and online duel

on:
  push:
    branches:
      - agent/mobile-secret-online-duel
    paths:
      - .github/workflows/one-time-mobile-secret-online-duel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-secret-online-duel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          replacements = [
              (
                  '[onlineMode,setOnlineMode]=useState<GameMode>("classic"),[pending,setPending]=useState(false);',
                  '[onlineMode,setOnlineMode]=useState<GameMode>("classic"),[onlineDuelBreakTarget,setOnlineDuelBreakTarget]=useState(1),[pending,setPending]=useState(false);'
              ),
              (
                  '<div><small>SPELARE</small><b><i style={{background:PLAYER_COLORS[state.currentPlayerIndex]}}/>{game.currentPlayer}</b></div>',
                  '<div className="secret-trigger" onPointerDown={event=>event.preventDefault()} onClick={tapCurrentPlayer}><small>SPELARE</small><b><i style={{background:PLAYER_COLORS[state.currentPlayerIndex]}}/>{game.currentPlayer}</b></div>'
              ),
              (
                  'mode={onlineMode} country={onlineCountry}',
                  'mode={onlineMode} duelBreakTarget={onlineDuelBreakTarget} country={onlineCountry}'
              ),
              (
                  'onMode={setOnlineMode} onCountry=',
                  'onMode={setOnlineMode} onDuelBreakTarget={setOnlineDuelBreakTarget} onCountry='
              ),
              (
                  'game.startGame(lobby.map(p=>p.name),onlineMode,onlineCountry)',
                  'game.startGame(lobby.map(p=>p.name),onlineMode,onlineCountry,onlineDuelBreakTarget)'
              ),
              (
                  'function OnlineLobby({role,status,name,room,error,lobby,mode,country,playerId,onName,onRoom,onMode,onCountry,',
                  'function OnlineLobby({role,status,name,room,error,lobby,mode,duelBreakTarget,country,playerId,onName,onRoom,onMode,onDuelBreakTarget,onCountry,'
              ),
              (
                  'lobby:LobbyPlayer[];mode:GameMode;country:Country;playerId:string;onName:(v:string)=>void;onRoom:(v:string)=>void;onMode:(v:GameMode)=>void;onCountry:',
                  'lobby:LobbyPlayer[];mode:GameMode;duelBreakTarget:number;country:Country;playerId:string;onName:(v:string)=>void;onRoom:(v:string)=>void;onMode:(v:GameMode)=>void;onDuelBreakTarget:(v:number)=>void;onCountry:'
              ),
              (
                  'const ready=lobby.length>=2&&lobby.every(p=>p.connected&&p.ready),me=lobby.find(p=>p.id===playerId);',
                  'const playerCountReady=mode==="duel"?lobby.length===2:lobby.length>=2,ready=playerCountReady&&lobby.every(p=>p.connected&&p.ready),me=lobby.find(p=>p.id===playerId);'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected App.tsx fragment: {old[:90]}')
              text = text.replace(old, new, 1)

          old_modes = '<div className="mode-grid compact"><button className={mode==="classic"?"selected":""} onClick={()=>onMode("classic")}><strong>Klassisk</strong></button><button className={mode==="blitz"?"selected blitz":""} onClick={()=>onMode("blitz")}><strong>Blitz · 15 s</strong></button></div><button className="primary" disabled={!ready} onClick={onStart}>{ready?"Starta matchen":"Väntar på spelare"}<span>→</span></button>'
          new_modes = '<div className="mode-grid compact online-mode-grid"><button className={mode==="classic"?"selected":""} onClick={()=>onMode("classic")}><strong>Klassisk</strong></button><button className={mode==="blitz"?"selected blitz":""} onClick={()=>onMode("blitz")}><strong>Blitz · 15 s</strong></button><button className={mode==="duel"?"selected duel":""} onClick={()=>onMode("duel")}><strong>Duell · 2 linjer</strong></button></div>{mode==="duel"&&<div className="online-duel-target"><span>Brytningar för vinst</span><div className="stepper"><button type="button" onClick={()=>onDuelBreakTarget(Math.max(1,duelBreakTarget-1))}>−</button><b>{duelBreakTarget}</b><button type="button" onClick={()=>onDuelBreakTarget(Math.min(5,duelBreakTarget+1))}>+</button></div></div>}{mode==="duel"&&lobby.length!==2&&<p className="duel-player-warning">Duell kräver exakt 2 spelare.</p>}<button className="primary" disabled={!ready} onClick={onStart}>{ready?"Starta matchen":mode==="duel"&&lobby.length!==2?"Duell kräver 2 spelare":"Väntar på spelare"}<span>→</span></button>'
          if old_modes not in text:
              raise SystemExit('Missing expected online mode controls')
          text = text.replace(old_modes, new_modes, 1)
          app.write_text(text)

          css = Path('src/online.css')
          styles = css.read_text()
          marker = '/* Online duel controls */'
          if marker not in styles:
              styles += '''\n\n/* Online duel controls */\n.online-mode-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}\n.online-mode-grid button{min-width:0;padding:12px 7px;text-align:center}\n.online-mode-grid strong{font-size:10px;line-height:1.2}\n.online-mode-grid .selected.duel{border-color:#8b5cf6;box-shadow:inset 0 -3px #8b5cf6}\n.online-duel-target{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 4px;padding:10px 12px;border:1px solid #c8dbd7;background:#dfece9}\n.online-duel-target>span{color:#476967;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}\n.online-duel-target .stepper{display:flex;align-items:center;flex:0 0 auto;background:#cddfdb}\n.online-duel-target .stepper button{width:32px;height:32px;border:0;background:transparent;color:#173b39;font-size:18px}\n.online-duel-target .stepper b{width:28px;text-align:center;color:#173b39}\n.duel-player-warning{margin:8px 0 0;color:#b13d44;font-size:10px;font-weight:800}\n@media(max-width:390px){.online-mode-grid{grid-template-columns:1fr 1fr}.online-mode-grid button:last-child{grid-column:1/-1}}\n'''
          css.write_text(styles)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/online.css
          git commit -m "Återställ land-easter egg och lägg till online-duell"
          git push origin HEAD:agent/mobile-secret-online-duel
