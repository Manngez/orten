name: One-time online watchdog fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-online-watchdog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch online connection watchdogs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const createRoom=()=>{',
              '  const createRoom=(autoRetry=0):void=>{',
              'createRoom signature',
          )
          replace_once(
              '    stopNetwork();game.resetGame();setRole("host");setPlayerId("host");setStatus("connecting");setError("");',
              '    stopNetwork();game.resetGame();setRole("host");setPlayerId("host");setStatus(autoRetry?"reconnecting":"connecting");setError("");',
              'host status',
          )
          replace_once(
              '    const generation=networkGenerationRef.current,peer=new Peer(roomPeerId(code),peerOptions());peerRef.current=peer;\n    peer.on("open",()=>{if(generation!==networkGenerationRef.current)return;setStatus("connected");setError("")});peer.on("connection",attachGuest);',
              '    const generation=networkGenerationRef.current,peer=new Peer(roomPeerId(code),peerOptions());peerRef.current=peer;\n    const startupTimer=window.setTimeout(()=>{if(generation!==networkGenerationRef.current||peer.destroyed||peer.open)return;peer.destroy();peerRef.current=null;if(autoRetry<2){setStatus("reconnecting");setError(`Anslutningstjänsten svarar inte. Nytt försök ${autoRetry+1}/2…`);reconnectTimerRef.current=window.setTimeout(()=>createRoom(autoRetry+1),1200);return}setStatus("error");setError("Kunde inte nå nätverkstjänsten inom 8 sekunder. Kontrollera internet och försök igen.")},8000);\n    peer.on("open",()=>{window.clearTimeout(startupTimer);if(generation!==networkGenerationRef.current)return;setStatus("connected");setError("")});peer.on("connection",attachGuest);',
              'host startup watchdog',
          )
          replace_once(
              '    peer.on("error",e=>{if(generation!==networkGenerationRef.current)return;setStatus("error");setError(e.type==="unavailable-id"?"Rumskoden används redan.":networkError(e.type))});',
              '    peer.on("error",e=>{window.clearTimeout(startupTimer);if(generation!==networkGenerationRef.current)return;setStatus("error");setError(e.type==="unavailable-id"?"Rumskoden används redan.":networkError(e.type))});',
              'host error watchdog cleanup',
          )

          replace_once(
              '  const joinRoom=()=>{',
              '  const joinRoom=(autoRetry=0):void=>{',
              'joinRoom signature',
          )
          replace_once(
              '    stopNetwork();game.resetGame();setRole("guest");setStatus("connecting");setError("");',
              '    stopNetwork();game.resetGame();setRole("guest");setStatus(autoRetry?"reconnecting":"connecting");setError("");',
              'guest status',
          )
          replace_once(
              '    const generation=networkGenerationRef.current,peer=new Peer(peerOptions());peerRef.current=peer;let attempts=0,openedOnce=false;\n    const connectToHost=()=>{',
              '    const generation=networkGenerationRef.current,peer=new Peer(peerOptions());peerRef.current=peer;let attempts=0,openedOnce=false;\n    const startupTimer=window.setTimeout(()=>{if(generation!==networkGenerationRef.current||peer.destroyed||peer.open)return;peer.destroy();peerRef.current=null;if(autoRetry<2){setStatus("reconnecting");setError(`Anslutningstjänsten svarar inte. Nytt försök ${autoRetry+1}/2…`);reconnectTimerRef.current=window.setTimeout(()=>joinRoom(autoRetry+1),1200);return}setStatus("error");setError("Kunde inte nå nätverkstjänsten inom 8 sekunder. Kontrollera internet och försök igen.")},8000);\n    const connectToHost=()=>{',
              'guest startup watchdog',
          )
          replace_once(
              '      const retry=(type?:string)=>{if(settled||generation!==networkGenerationRef.current)return;settled=true;if(attempts>=5){setStatus("error");setError(networkError(type));return}attempts++;const delay=Math.min(1000*2**(attempts-1),8000);setStatus("reconnecting");setError(`Anslutningen bröts. Nytt försök om ${Math.ceil(delay/1000)} s…`);reconnectTimerRef.current=window.setTimeout(connectToHost,delay)};\n      connection.on("open",()=>{settled=false;openedOnce=true;attempts=0;setStatus("connected");setError("");connection.send({type:"JOIN",id,name:name.trim()} satisfies NetworkMessage)});',
              '      const retry=(type?:string)=>{if(settled||generation!==networkGenerationRef.current)return;settled=true;if(attempts>=3){setStatus("error");setError(networkError(type));return}attempts++;const delay=Math.min(1000*2**(attempts-1),8000);setStatus("reconnecting");setError(`Anslutningen bröts. Nytt försök om ${Math.ceil(delay/1000)} s…`);reconnectTimerRef.current=window.setTimeout(connectToHost,delay)};\n      const connectionTimer=window.setTimeout(()=>{if(settled||connection.open)return;retry(openedOnce?"network":"peer-unavailable");connection.close()},8000);\n      connection.on("open",()=>{window.clearTimeout(connectionTimer);settled=false;openedOnce=true;attempts=0;setStatus("connected");setError("");connection.send({type:"JOIN",id,name:name.trim()} satisfies NetworkMessage)});',
              'data connection watchdog',
          )
          replace_once(
              '      connection.on("close",()=>retry(openedOnce?"network":"peer-unavailable"));connection.on("error",error=>retry((error as {type?:string}).type));',
              '      connection.on("close",()=>{window.clearTimeout(connectionTimer);retry(openedOnce?"network":"peer-unavailable")});connection.on("error",error=>{window.clearTimeout(connectionTimer);retry((error as {type?:string}).type)});',
              'data connection watchdog cleanup',
          )
          replace_once(
              '    peer.on("open",connectToHost);peer.on("disconnected",()=>{',
              '    peer.on("open",()=>{window.clearTimeout(startupTimer);connectToHost()});peer.on("disconnected",()=>{',
              'guest peer open watchdog cleanup',
          )
          replace_once(
              '    peer.on("error",e=>{if(generation!==networkGenerationRef.current)return;if(e.type==="peer-unavailable"&&!openedOnce){setStatus("error");setError(networkError(e.type));return}if(!hostRef.current?.open){setStatus("error");setError(networkError(e.type))}});',
              '    peer.on("error",e=>{window.clearTimeout(startupTimer);if(generation!==networkGenerationRef.current)return;if(e.type==="peer-unavailable"&&!openedOnce){setStatus("error");setError(networkError(e.type));return}if(!hostRef.current?.open){setStatus("error");setError(networkError(e.type))}});',
              'guest error watchdog cleanup',
          )
          replace_once(
              ' onCreate={createRoom} onJoin={joinRoom} onRetry={role==="host"?createRoom:joinRoom} ',
              ' onCreate={()=>createRoom()} onJoin={()=>joinRoom()} onRetry={role==="host"?()=>createRoom():()=>joinRoom()} ',
              'lobby callback wrappers',
          )

          path.write_text(text)
          PY
      - name: Build check
        run: npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Förhindra fastnad onlineanslutning"
          git push
